<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e1b4b">
<title>BAB3 · Informatika VIII Semester Ganjil</title>
<style>
:root{
  --navy:#0f2a4a;--teal:#0e7490;--teal-l:#e0f4f8;--orange:#f97316;--orange-l:#fff1e6;
  --green:#16a34a;--green-l:#e8f7ee;--purple:#7c3aed;--purple-l:#f1ebfe;--red:#dc2626;--red-l:#fdecec;
  --yellow:#ca8a04;--yellow-l:#fef9e3;--ink:#1e293b;--muted:#64748b;--line:#dbe3ec;--bg:#f2f7fb;--card:#fff;
  --z:1;
}
html{font-size:calc(16px * var(--z))}
@media (min-width:1500px){html{font-size:calc(19px * var(--z))}}
@media (min-width:2200px){html{font-size:calc(24px * var(--z))}}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit}
h1,h2,h3,h4,h5{margin:0;line-height:1.3;color:var(--navy)}
p{margin:.4rem 0 .7rem}
b,strong{color:var(--navy)}
.muted{color:var(--muted)}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}

/* ===== TOP BAR ===== */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.top .wrap{display:flex;align-items:center;gap:8px;min-height:56px}
.top .ttl{flex:1;min-width:0;font-weight:700;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl small{display:block;font-weight:500;color:#a5f3fc;font-size:.75rem}
.ib{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:10px;min-width:42px;height:42px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:4px;font-weight:700;font-size:.9rem}
.ib:active{background:rgba(255,255,255,.3)}
.score-pill{background:var(--orange);border-color:var(--orange)}
.tools{display:flex;gap:6px}
@media (max-width:640px){.tools .opt{display:none}}

/* ===== STEPPER ===== */
.stepper{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:56px;z-index:15}
.stepper .wrap{display:flex;gap:6px;overflow-x:auto;padding-top:8px;padding-bottom:8px;scrollbar-width:thin}
.st{flex:none;display:flex;align-items:center;gap:6px;border:2px solid var(--line);background:#fff;border-radius:30px;padding:4px 12px 4px 4px;font-size:.8rem;font-weight:600;color:var(--muted);white-space:nowrap}
.st .n{width:26px;height:26px;border-radius:50%;background:#eef2f6;display:grid;place-items:center;font-size:.85rem}
.st.done{border-color:#a6e0bb;color:var(--green)}
.st.done .n{background:var(--green-l)}
.st.cur{border-color:var(--orange);background:var(--orange-l);color:#9a3412}
.st.cur .n{background:var(--orange);color:#fff}

/* ===== CONTENT ===== */
main{padding:18px 0 110px}
.step-head{display:flex;align-items:center;gap:12px;margin:4px 0 16px}
.step-head .big{font-size:2rem;width:58px;height:58px;border-radius:16px;background:#fff;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.step-head .lbl{font-size:.8rem;font-weight:700;letter-spacing:1px;color:var(--orange);text-transform:uppercase}
.step-head h2{font-size:1.5rem}

.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.96);border-top:1px solid var(--line);backdrop-filter:blur(6px);padding-bottom:env(safe-area-inset-bottom)}
.bottom .wrap{display:flex;align-items:center;gap:10px;min-height:68px}
.bottom .prog{flex:1;height:8px;background:#e5edf3;border-radius:8px;overflow:hidden}
.bottom .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--orange));border-radius:8px;transition:width .3s}

.btn{border:none;background:var(--teal);color:#fff;font-weight:700;border-radius:12px;padding:12px 20px;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.or{background:var(--orange)}
.btn.gr{background:var(--green)}
.btn.ghost{background:#fff;color:var(--teal);border:2px solid var(--teal);box-shadow:none}
.btn[disabled]{opacity:.4;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}

/* ===== CARDS & BOXES ===== */
.card{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.card-h .cic{font-size:1.5rem;width:44px;height:44px;border-radius:12px;background:var(--teal-l);display:grid;place-items:center;flex:none}
.card-h h4{font-size:1.05rem}
.box{border-radius:16px;padding:14px 16px;margin:12px 0;border:2px solid}
.box-t{font-weight:800;color:var(--navy);margin-bottom:6px;font-size:1.05rem}
.teal{background:var(--teal-l);border-color:#9fd9e6}
.orange{background:var(--orange-l);border-color:#fdc79e}
.green{background:var(--green-l);border-color:#a6e0bb}
.purple{background:var(--purple-l);border-color:#cdb6fb}
.red{background:var(--red-l);border-color:#f5b5b5}
.yellow{background:var(--yellow-l);border-color:#f5dd7a}
.white{background:#fff;border-color:var(--line)}
.def{background:#fff;border:2px dashed var(--teal);border-radius:14px;padding:12px 16px;margin:10px 0}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.mini{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.mini .e{font-size:2rem;line-height:1.2}
.mini b{display:block;margin-top:4px}
.mini span{font-size:.85rem;color:var(--muted)}
.ul{margin:.3rem 0 .6rem;padding-left:1.3rem}
.ul li{margin-bottom:.3rem}
.tag{display:inline-block;background:var(--navy);color:#fff;border-radius:20px;padding:2px 10px;font-size:.8rem;font-weight:700;margin:2px 3px 2px 0}
table.t{width:100%;border-collapse:collapse;font-size:.92rem;background:#fff;border-radius:12px;overflow:hidden;margin:8px 0}
table.t th{background:var(--navy);color:#fff;text-align:left;padding:8px 10px}
table.t td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:nth-child(even) td{background:#f6f9fc}
.tblwrap{overflow-x:auto}

/* accordion */
details.acc{background:#fff;border:2px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}
details.acc>summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:800;color:var(--navy);font-size:1.05rem;display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,var(--teal-l),#fff)}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"▾";margin-left:auto;color:var(--teal);transition:transform .2s}
details.acc[open]>summary::after{transform:rotate(180deg)}
details.acc .acc-b{padding:6px 16px 14px}
details.rv{background:var(--yellow-l);border:2px solid #f5dd7a;border-radius:14px;padding:10px 14px;margin:10px 0}
details.rv summary{cursor:pointer;font-weight:700;color:#854d0e}
details.rv[open] summary{margin-bottom:6px}

/* flow */
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px;margin:8px 0}
.fs{flex:1 1 120px;background:var(--teal-l);border:2px solid #9fd9e6;border-radius:12px;padding:8px;text-align:center;font-size:.88rem;line-height:1.35}
.fs b{display:block;color:var(--teal)}
.fa{align-self:center;color:var(--orange);font-weight:900;font-size:1.3rem}
.flow.o .fs{background:var(--orange-l);border-color:#fdc79e}.flow.o .fs b{color:var(--orange)}
.flow.g .fs{background:var(--green-l);border-color:#a6e0bb}.flow.g .fs b{color:var(--green)}
.flow.p .fs{background:var(--purple-l);border-color:#cdb6fb}.flow.p .fs b{color:var(--purple)}
.flow.y .fs{background:var(--yellow-l);border-color:#f5dd7a}.flow.y .fs b{color:var(--yellow)}
@media (max-width:640px){.fa{display:none}.fs{flex-basis:44%}}

/* hero */
.hero{border-radius:24px;background:linear-gradient(150deg,#0f2a4a 0%,#0e7490 65%,#14b8a6 100%);color:#fff;padding:28px 22px;position:relative;overflow:hidden}
.hero h1{color:#fff;font-size:2.1rem;margin:10px 0 6px}
.hero .sub{color:#a5f3fc;font-weight:600}
.hero .pill{display:inline-block;background:var(--orange);color:#fff;font-weight:800;border-radius:30px;padding:4px 14px;font-size:.85rem;letter-spacing:.5px}
.hero .art{font-size:3.2rem;letter-spacing:.3rem;margin:18px 0 8px}
.hero .meta{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);border-radius:14px;padding:10px 14px;font-size:.9rem;margin-top:14px}
.hero .meta b{color:#fde68a}

/* charts */
.bars{display:flex;align-items:flex-end;gap:18px;height:130px;padding:6px 10px;border-left:2px solid #94a3b8;border-bottom:2px solid #94a3b8;margin:6px auto;max-width:280px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.bars i{display:block;width:100%;border-radius:6px 6px 0 0;height:var(--h)}
.bars span{font-size:.75rem;margin-top:4px;text-align:center}
.pie{width:120px;height:120px;border-radius:50%;margin:6px auto}
.lg{font-size:.82rem;text-align:left;display:inline-block}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}

/* scratch blocks */
.blk{display:block;width:max-content;max-width:100%;color:#fff;font-weight:700;font-size:.85rem;padding:6px 12px;border-radius:4px;margin:0}
.blk.ev{background:#eab308;border-radius:16px 16px 4px 4px;padding-top:8px}
.blk.mo{background:#3b82f6}.blk.lo{background:#a855f7}.blk.ct{background:#f97316}.blk.so{background:#ec4899}
.blkwrap{background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px;display:inline-block}

/* ===== ACTIVITIES ===== */
.act{background:#fff;border:3px solid #c7e7ef;border-radius:20px;padding:16px;margin:16px 0;box-shadow:0 4px 0 #dbeef3}
.act-h{display:flex;align-items:center;gap:12px}
.act-ic{font-size:1.6rem;width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--orange),#fb923c);display:grid;place-items:center;flex:none;color:#fff}
.act-type{font-size:.75rem;font-weight:800;color:var(--orange);letter-spacing:1px;text-transform:uppercase}
.act-h h4{font-size:1.1rem}
.act-ins{background:var(--teal-l);border-radius:10px;padding:8px 12px;font-size:.92rem;margin:10px 0}
.lbl2{font-size:.8rem;font-weight:700;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.5px}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:58px;padding:10px;border:2px dashed #b6cbd9;border-radius:14px;background:#f8fbfd}
.tile{position:relative;padding:10px 14px;border-radius:12px;background:#fff;border:2px solid #9fd9e6;font-weight:600;min-height:48px;display:inline-flex;align-items:center;gap:8px;text-align:left;line-height:1.3;user-select:none;-webkit-user-select:none;transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile.sel{outline:4px solid var(--orange);outline-offset:1px;background:var(--orange-l)}
.tile.ok{background:var(--green-l)!important;border-color:var(--green)!important}
.tile.bad{background:var(--red-l)!important;border-color:var(--red)!important}
.tile .n{width:26px;height:26px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:.8rem;flex:none}
.tile .dot{width:14px;height:14px;border-radius:50%;flex:none}
.seq{list-style:none;margin:0;padding:10px;border:2px solid #9fd9e6;border-radius:14px;min-height:58px;display:flex;flex-direction:column;gap:6px;background:#f2fafc}
.seq .tile{width:100%}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:10px}
.cat{border:3px solid var(--line);border-radius:16px;padding:8px;min-height:120px;background:#fff;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.cat h5{font-size:.95rem;text-align:center;padding:6px;border-radius:10px;color:#fff}
.cat.hl{border-style:dashed;border-color:var(--orange);background:var(--orange-l)}
.cat .tile{font-size:.85rem;min-height:40px;padding:6px 10px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:8px}
.match .tile{width:100%}
.qprog{display:flex;align-items:center;gap:10px;font-weight:700;font-size:.85rem;color:var(--muted)}
.qprog .bar{flex:1;height:8px;background:#e5edf3;border-radius:8px;overflow:hidden}
.qprog .bar i{display:block;height:100%;background:var(--orange)}
.qtext{font-size:1.15rem;font-weight:700;color:var(--navy);margin:14px 0}
.qopts{display:grid;gap:8px}
.qopts.two{grid-template-columns:1fr 1fr}
.qopt{display:flex;align-items:center;gap:10px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;min-height:54px;font-weight:600}
.qopt .ql{width:30px;height:30px;border-radius:9px;background:var(--teal-l);color:var(--teal);font-weight:800;display:grid;place-items:center;flex:none}
.qopt.ok{background:var(--green-l);border-color:var(--green)}
.qopt.bad{background:var(--red-l);border-color:var(--red)}
.qfb{margin-top:10px}
.fb{border-radius:12px;padding:10px 14px;font-size:.95rem}
.fb.ok{background:var(--green-l);border:2px solid #a6e0bb}
.fb.bad{background:var(--red-l);border:2px solid #f5b5b5}
.res{border-radius:14px;padding:12px 16px;font-size:1.05rem;margin-top:12px}
.res.good{background:var(--green-l);border:2px solid var(--green)}
.res.mid{background:var(--yellow-l);border:2px solid #f5dd7a}
.res.low{background:var(--red-l);border:2px solid #f5b5b5}
.hint{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:.88rem;margin-top:10px}
.fillq{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
.fillq input,.tf input{flex:1 1 180px;min-height:46px;border:2px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff}
.fillq input.ok,.tf input.ok{border-color:var(--green);background:var(--green-l)}
.fillq input.bad,.tf input.bad{border-color:var(--red);background:var(--red-l)}
.tf table{width:100%;border-collapse:collapse}
.tf th{background:var(--navy);color:#fff;padding:8px;text-align:left}
.tf td{padding:6px;border-bottom:1px solid var(--line)}
.tf input{width:100%}
.mem{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.mc{min-height:96px;border-radius:14px;border:none;background:linear-gradient(135deg,var(--teal),var(--navy));color:#fff;font-weight:700;padding:8px;font-size:.9rem;line-height:1.3}
.mc.open{background:#fff;color:var(--navy);border:3px solid var(--orange)}
.mc.done{background:var(--green-l);color:var(--green);border:3px solid var(--green)}
.mc .q{font-size:2rem}
.maze{display:grid;gap:4px;margin:8px auto;max-width:420px}
.cell{aspect-ratio:1;border-radius:8px;background:#f1f5f9;border:1px solid #dbe3ec;display:grid;place-items:center;font-size:1.6rem;position:relative}
.cell.w{background:#475569}
.cell.hit{background:var(--red-l);border-color:var(--red)}
.cell.trail{background:#e0f4f8}
.bot{display:grid;place-items:center;transition:transform .25s}
.bot .ar{position:absolute;right:-2px;top:50%;font-size:.9rem;color:var(--orange);transform:translateY(-50%)}
.cmds{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.cmd{border:none;border-radius:12px;color:#fff;font-weight:800;padding:10px 14px;min-height:48px}
.cmd.m{background:#3b82f6}.cmd.l{background:#f97316}.cmd.r{background:#a855f7}
.prog-list{display:flex;flex-wrap:wrap;gap:6px;min-height:52px;padding:8px;border:2px dashed #b6cbd9;border-radius:12px;background:#f8fbfd}
.prog-list .cmd{min-height:38px;padding:6px 10px;font-size:.85rem}
.prog-list .cmd.run{outline:3px solid var(--navy)}
.bugline{display:block;width:100%;text-align:left;margin-bottom:6px}
.flip{perspective:900px;min-height:150px;cursor:pointer;border:none;background:none;padding:0}
.flip .in{position:relative;width:100%;height:100%;min-height:150px;transition:transform .5s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .fa1,.flip .fa2{position:absolute;inset:0;border-radius:16px;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip .fa1{color:#fff;font-weight:800;font-size:1.1rem}
.flip .fa1 .e{font-size:2.2rem}
.flip .fa1 small{font-weight:500;opacity:.85;font-size:.75rem;margin-top:6px}
.flip .fa2{background:#fff;border:3px solid var(--line);transform:rotateY(180deg);font-size:.92rem;color:var(--ink)}
.poll{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.popt{border:3px solid var(--line);background:#fff;border-radius:16px;padding:14px;font-weight:700;min-height:90px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.popt .e{font-size:2.2rem}
.popt.pick{border-color:var(--orange);background:var(--orange-l)}
.timer{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
.timer .tv{font-size:3rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--navy);min-width:150px;text-align:center}
.timer .tv.end{color:var(--red);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
.hot{display:flex;flex-wrap:wrap;gap:8px}
.hot button{border:none;border-radius:12px;color:#fff;font-weight:700;padding:10px 14px;min-height:46px}
.hot-d{margin-top:10px;background:#f8fafc;border:2px solid var(--line);border-radius:12px;padding:10px 14px;min-height:56px}
.emo{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.emo button{font-size:2.2rem;background:#fff;border:3px solid var(--line);border-radius:16px;width:74px;height:74px}
.emo button.pick{border-color:var(--orange);background:var(--orange-l);transform:scale(1.08)}
.chk label{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px;cursor:pointer;min-height:48px}
.chk input{width:22px;height:22px;accent-color:var(--green)}
.kamus input{width:100%;min-height:48px;border:2px solid var(--line);border-radius:12px;padding:8px 14px;margin-bottom:10px}

/* certificate */
.cert{background:linear-gradient(135deg,#fff7ed,#fff);border:4px double var(--orange);border-radius:20px;padding:22px;text-align:center}
.cert h3{font-size:1.4rem;color:var(--orange)}
.cert .nm{font-size:1.8rem;font-weight:800;color:var(--navy);margin:6px 0}
.cert .stars{font-size:2.2rem;letter-spacing:.3rem}
.cert .sc{font-size:1.2rem;font-weight:700}

/* home */
.home-hero{margin-top:18px}
.pcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:18px 0}
.pc{background:#fff;border:3px solid var(--line);border-radius:20px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:200px}
.pc .num{font-weight:800;color:var(--orange);font-size:.85rem;letter-spacing:1px}
.pc .e{font-size:2.4rem}
.pc h3{font-size:1.1rem}
.pc .pb{height:8px;background:#e5edf3;border-radius:8px;overflow:hidden;margin-top:auto}
.pc .pb i{display:block;height:100%;background:var(--green)}
.pc small{color:var(--muted)}
.namebox{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.namebox input{flex:1 1 220px;min-height:50px;border:2px solid var(--line);border-radius:12px;padding:8px 14px}

#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 18px;border-radius:30px;font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:50;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

}
function ansOk(v, x){
  var nx = norm(x); if (!nx || !v) return false;
  if (/^\d+$/.test(nx)) return v.indexOf('min') !== 0 && (v.match(/\d+/g) || []).join('') === nx;
  return v === nx || v.indexOf(nx) >= 0;
}

function beep(ok){
  if (!S.sound) return;
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    var o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.connect(g); g.connect(AC.destination);
    if (ok){ o.type = 'sine'; o.frequency.setValueAtTime(660, t); o.frequency.setValueAtTime(880, t + .1); }
    else { o.type = 'square'; o.frequency.setValueAtTime(200, t); }
    g.gain.setValueAtTime(.12, t); g.gain.exponentialRampToValueAtTime(.001, t + .35);

  }catch(e){}
}

    pendalaman:
      lkHead(3,'Robot Ozobot “Si Pilah” 🤖','LKPD_Bab3_Pertemuan3_Studi_Kasus_Robot_Si_Pilah') +
      '<p><b>Kasus.</b> OSIS memprogram Ozobot <b>“Si Pilah”</b> untuk mengantar kantong sampah dari <b>kelas 🏫</b> ke <b>Bank Sampah ♻️</b>, memasukkannya ke tong yang sesuai, dan memutar jingle pengingat.</p>' +
      code('<span class="kw">PROSEDUR</span> AntarSampah(jenis)\n  <span class="kw">JIKA</span> jenis = "plastik" <span class="kw">MAKA</span> masukkan ke Tong Kuning\n  <span class="kw">SELAIN JIKA</span> jenis = "kertas" <span class="kw">MAKA</span> masukkan ke Tong Biru\n  <span class="kw">SELAIN ITU</span> masukkan ke Tong Hijau\n<span class="kw">AKHIR PROSEDUR</span>\n\nbaterai ← 100\njumlahAntar ← 0\n<span class="kw">ULANGI</span> 5 <span class="kw">KALI</span>\n  AntarSampah(jenis kantong berikutnya)\n  baterai ← baterai − 15\n  jumlahAntar ← jumlahAntar + 1\n<span class="kw">AKHIR ULANGI</span>\n<span class="kw">JIKA</span> baterai &lt; 30 <span class="kw">MAKA</span> <span class="kw">TAMPILKAN</span> "Isi daya!"') +

      box('purple','🧘🎉 Proyek Kelompok (3–4 siswa): Misi Si Pilah',

          ol(['Gambar lintasan dari START (kelas) ke FINISH (bank sampah) dengan <b>spidol hitam tebal</b>.','Beri titik warna di tikungan: <b>biru = belok kiri</b>, <b>hijau = belok kanan</b>, <b>merah = berhenti</b>.','Tulis <b>kartu perintah</b> berurutan, misalnya: Maju 3 langkah, Belok kiri, …, Berhenti.','Satu teman menjadi <b>“manusia Ozobot”</b>: berjalan di lantai mengikuti kartu perintah (atau jalankan Ozobot asli di atas kertas jika ada). Teman lain mengecek apakah sampai di FINISH.','<b>Bukti:</b> foto lintasan dan kartu perintah.']) +
          '<p><b>🖼️ Contoh hasil yang diharapkan:</b></p>' + '<svg viewBox="0 0 440 236" style="width:100%;max-width:560px;display:block;margin:6px auto" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI,Arial,sans-serif"><rect x="6" y="6" width="262" height="224" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="137" y="24" font-size="11" text-anchor="middle" fill="#475569">Kertas HVS · lintasan spidol hitam tebal</text><polyline points="44,196 134,196 134,84 230,84" fill="none" stroke="#111" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><circle cx="122" cy="196" r="8" fill="#2563eb" stroke="#fff" stroke-width="2"/><circle cx="134" cy="96" r="8" fill="#16a34a" stroke="#fff" stroke-width="2"/><circle cx="218" cy="84" r="8" fill="#dc2626" stroke="#fff" stroke-width="2"/><text x="26" y="222" font-size="12" font-weight="700" fill="#0f172a">🏫 START (kelas)</text><text x="200" y="64" font-size="12" font-weight="700" fill="#0f172a">♻️ FINISH</text><text x="146" y="182" font-size="10" fill="#1d4ed8">biru = belok kiri</text><text x="20" y="100" font-size="10" fill="#15803d">hijau = belok kanan →</text><text x="160" y="108" font-size="10" fill="#b91c1c">↑ merah = berhenti</text><rect x="282" y="6" width="152" height="224" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="358" y="24" font-size="11" font-weight="700" text-anchor="middle" fill="#92400e">Kartu perintah</text><text x="358" y="37" font-size="10" text-anchor="middle" fill="#92400e">"manusia Ozobot"</text><g font-size="11" font-weight="700"><rect x="292" y="46" width="132" height="24" rx="6" fill="#3b82f6"/><text x="300" y="62" fill="#fff">1. ⬆ Maju 3 langkah</text><rect x="292" y="76" width="132" height="24" rx="6" fill="#2563eb"/><text x="300" y="92" fill="#fff">2. Belok kiri (biru)</text><rect x="292" y="106" width="132" height="24" rx="6" fill="#3b82f6"/><text x="300" y="122" fill="#fff">3. ⬆ Maju 4 langkah</text><rect x="292" y="136" width="132" height="24" rx="6" fill="#16a34a"/><text x="300" y="152" fill="#fff">4. Belok kanan (hijau)</text><rect x="292" y="166" width="132" height="24" rx="6" fill="#3b82f6"/><text x="300" y="182" fill="#fff">5. ⬆ Maju 3 langkah</text><rect x="292" y="196" width="132" height="24" rx="6" fill="#dc2626"/><text x="300" y="212" fill="#fff">6. Berhenti (merah)</text></g></svg>' +
          '<p class="muted">Aturan warna hanya simulasi kelas; kode warna resmi lihat panduan Ozobot.</p>' +
        '</div></details>' +
        '<details class="pj-opt dg"><summary>💻 Digital (langsung di web ini)</summary><div class="pj-body">' +

          act('pj3') +

        '<p class="muted">Penilaian proyek oleh guru (kerja sama, ketepatan perintah, dan presentasi); tidak masuk skor web.</p>'),

function maxOf(a){
  switch (a.type){
    case 'order': return a.items.length;
    case 'match': return a.pairs.length;
    case 'cat': return a.items.length;
    case 'quiz': return a.qs.length;
    case 'fill': return a.qs.length;
    case 'memory': return a.pairs.length;
    case 'maze': return a.levels.length * 3;
    case 'bug': return a.items.length;
    case 'line': return a.pairs.length;
    case 'essay': return a.qs.reduce(function(n, q){ return n + q.k.length; }, 0);
    case 'tablefill': return a.rows.reduce(function(n, r){ return n + r.c.length; }, 0);
    case 'blockly': return a.noScore ? 0 : a.levels.length;
    default: return 0;
  }
}
function award(pk, id, s, m){
  S.res[pk] = S.res[pk] || {};
  var prev = S.res[pk][id];
  S.first = S.first || {}; S.first[pk] = S.first[pk] || {}; if (!S.first[pk][id]) S.first[pk][id] = {s:s, m:m};
  if (!prev || s > prev.s) S.res[pk][id] = {s:s, m:m};
  save(); updScore();
}
function pScore(p){

E.maze = function(el, a, id, pk){
  var u = shell(el, a, 'Permainan Algoritma', '🤖');
  var DX = [1,0,-1,0], DY = [0,1,0,-1], ROT = [0,90,180,270];
  var lv = 0;
  function start(){
    var L = a.levels[lv], prog = [], running = false;
    function isWall(x, y){ return L.walls.some(function(w){ return w[0] === x && w[1] === y; }); }
    function grid(bx, by, bd, trail, hit){
      var h = '<div class="maze" style="grid-template-columns:repeat(' + L.w + ',1fr)">';
      for (var y = 0; y < L.h; y++) for (var x = 0; x < L.w; x++){
        var cls = 'cell' + (isWall(x, y) ? ' w' : '') + (trail && trail[x + ',' + y] ? ' trail' : '') + (hit && hit[0] === x && hit[1] === y ? ' hit' : '');
        var inner = '';
        if (x === L.g[0] && y === L.g[1]) inner = '⭐';
        if (x === bx && y === by) inner = '<span class="bot" style="transform:rotate(' + ROT[bd] + 'deg)">🤖<span class="ar">▶</span></span>';
        h += '<div class="' + cls + '">' + inner + '</div>';
      }
      return h + '</div>';
    }
    var NAMES = {m:'⬆ Maju', l:'↰ Kiri', r:'↱ Kanan'};
    function draw(bx, by, bd, trail, hit, runIdx){
      if (bx === undefined){ bx = L.s[0]; by = L.s[1]; bd = L.d; }
      u.body.innerHTML = '<div class="qprog"><span>Level ' + (lv + 1) + ' / ' + a.levels.length + '</span><span>Perintah: ' + prog.length + ' (terbaik: ' + L.best + ')</span></div>' + grid(bx, by, bd, trail, hit) +
        '<div class="cmds"><button class="cmd m" data-a="m">⬆ Maju</button><button class="cmd l" data-a="l">↰ Belok Kiri</button><button class="cmd r" data-a="r">↱ Belok Kanan</button></div>' +
        '<div class="lbl2">Programmu</div><div class="prog-list">' + (prog.length ? prog.map(function(c, k){ return '<button class="cmd ' + c + (runIdx === k ? ' run' : '') + '" data-k="' + k + '">' + (k + 1) + '. ' + NAMES[c] + '</button>'; }).join('') : '<span class="muted">Belum ada perintah…</span>') + '</div>' +
        '<div class="row"><button class="btn gr" data-run' + (running || !prog.length ? ' disabled' : '') + '>▶ Jalankan</button><button class="btn ghost" data-clr' + (running ? ' disabled' : '') + '>⌫ Hapus semua</button></div>';
      if (!running){
        $$('[data-a]', u.body).forEach(function(b){ b.onclick = function(){ if (prog.length >= 30) return; prog.push(b.dataset.a); draw(); }; });
        $$('[data-k]', u.body).forEach(function(b){ b.onclick = function(){ prog.splice(+b.dataset.k, 1); draw(); }; });
        $('[data-run]', u.body).onclick = run;
        $('[data-clr]', u.body).onclick = function(){ prog = []; u.foot.innerHTML = ''; draw(); };
      }
    }
    function run(){
      running = true; u.foot.innerHTML = '';
      var x = L.s[0], y = L.s[1], d = L.d, i = 0, trail = {};
      trail[x + ',' + y] = 1;
      draw(x, y, d, trail);
      function stepRun(){
        if (i >= prog.length){
          running = false;
          var win = x === L.g[0] && y === L.g[1];
          if (win){
            var sc = prog.length <= L.best ? 3 : 2;
            beep(true); confetti();
            var prev = (S.res[pk] && S.res[pk][id] && S.res[pk][id].lv) || {};
            prev[lv] = Math.max(prev[lv] || 0, sc);
            var tot = 0; Object.keys(prev).forEach(function(k){ tot += prev[k]; });
            award(pk, id, tot, a.levels.length * 3); S.res[pk][id].lv = prev; save();
            u.foot.innerHTML = '<div class="res good">🎉 Robot sampai di bintang! ' + (sc === 3 ? '⭐⭐⭐ Algoritma paling efisien!' : '⭐⭐ Berhasil! Bisakah dengan perintah lebih sedikit (' + L.best + ')?') + '</div><div class="row">' + (lv < a.levels.length - 1 ? '<button class="btn or" data-nx>Level berikutnya →</button>' : '') + '<button class="btn ghost" data-rt>↻ Coba lagi</button></div>';
            var nx = $('[data-nx]', u.foot); if (nx) nx.onclick = function(){ lv++; u.foot.innerHTML = ''; start(); };
            $('[data-rt]', u.foot).onclick = function(){ u.foot.innerHTML = ''; draw(); };
          } else {
            beep(false);
            u.foot.innerHTML = '<div class="res low">🤔 Robot belum sampai di bintang. Periksa programmu lalu perbaiki (<b>debugging</b>)!</div>';
          }
          draw(x, y, d, trail);
          return;
        }
        var c = prog[i];
        if (c === 'l') d = (d + 3) % 4;
        else if (c === 'r') d = (d + 1) % 4;
        else {
          var nx2 = x + DX[d], ny2 = y + DY[d];
          if (nx2 < 0 || ny2 < 0 || nx2 >= L.w || ny2 >= L.h || isWall(nx2, ny2)){
            running = false; beep(false);
            draw(x, y, d, trail, [Math.max(0, Math.min(L.w - 1, nx2)), Math.max(0, Math.min(L.h - 1, ny2))], i);
            u.foot.innerHTML = '<div class="res low">💥 Ups! Robot menabrak pada perintah ke-' + (i + 1) + '. Perbaiki programmu (<b>debugging</b>)!</div>';
            return;
          }
          x = nx2; y = ny2; trail[x + ',' + y] = 1;
        }
        draw(x, y, d, trail, null, i);
        i++; setTimeout(stepRun, 450);
      }
      setTimeout(stepRun, 350);
    }
    draw();
  }
  start();
};

E.spin = function(el, a){
  var u = shell(el, a, 'Pilih Acak · Dua Arah', '🎲');
  var max = a.max || 32, used = [], spinning = false;
  function draw(res){
    u.body.innerHTML = '<div class="spin-wrap"><div class="spin-num' + (res ? ' hit' : '') + '">' + (res || '?') + '</div>' +
      '<div class="row" style="justify-content:center"><label class="muted">Jumlah siswa: <input type="number" min="2" max="60" value="' + max + '" data-max style="width:80px;min-height:42px;border:2px solid var(--line);border-radius:10px;padding:4px 8px"></label>' +
      '<button class="btn or" data-go style="font-size:1.1rem">🎲 Putar!</button><button class="btn ghost" data-rs>↺ Reset</button></div>' +
      '<p class="muted" style="text-align:center;margin-top:8px">Sudah terpilih: ' + (used.length ? used.join(', ') : '-') + '</p></div>';
    $('[data-max]', u.body).onchange = function(){ max = Math.max(2, Math.min(60, +this.value || 32)); used = []; draw(); };
    $('[data-rs]', u.body).onclick = function(){ used = []; draw(); };
    $('[data-go]', u.body).onclick = go;
  }
  function go(){
    if (spinning) return;
    var pool = []; for (var i = 1; i <= max; i++) if (used.indexOf(i) < 0) pool.push(i);
    if (!pool.length){ toast('Semua nomor sudah terpilih. Ketuk Reset.'); return; }
    spinning = true;
    var n = 0, box2 = $('.spin-num', u.body), final = pool[Math.floor(Math.random() * pool.length)];
    var t = setInterval(function(){ box2.textContent = pool[Math.floor(Math.random() * pool.length)]; n++; if (n > 18){ clearInterval(t); used.push(final); spinning = false; draw(final); beep(true); toast('🎉 Absen nomor ' + final + '!'); } }, 70);
  }
  draw();
};


/* ---------- TARIK GARIS ---------- */
E.line = function(el, a, id, pk){
  var u = shell(el, a, 'Tarik Garis', '〰️');
  var COL = ['#0e7490','#f97316','#16a34a','#7c3aed','#dc2626','#ca8a04','#db2777','#0891b2'];
  function start(){
    var L = a.pairs.map(function(p, i){ return {t:p[0], i:i}; });
    var R = shuffleNot(a.pairs.map(function(p, i){ return {t:p[1], i:i}; }));
    var link = {}, selL = null, drag = null, checked = false;
    u.foot.innerHTML = '';
    u.body.innerHTML = '<div class="ln"><svg class="ln-svg"></svg><div class="ln-col">' + L.map(function(x, k){ return '<div class="ln-it ln-l" data-l="' + k + '"><span>' + x.t + '</span><i class="ln-dot"></i></div>'; }).join('') + '</div><div class="ln-gap"></div><div class="ln-col">' + R.map(function(x, r){ return '<div class="ln-it ln-r" data-r="' + r + '"><i class="ln-dot"></i><span>' + x.t + '</span></div>'; }).join('') + '</div></div><p class="muted" style="font-size:.85rem;margin-top:6px">✍️ Tarik garis dari titik kiri ke titik kanan (atau ketuk kiri lalu ketuk kanan). Ketuk kotak kiri lagi untuk menghapus garis.</p>';
    var box = $('.ln', u.body), svg = $('.ln-svg', u.body);
    function pt(elm, side){ var b = box.getBoundingClientRect(), r = elm.getBoundingClientRect(); return {x:(side === 'l' ? r.right : r.left) - b.left, y:r.top + r.height / 2 - b.top}; }
    function owner(r){ for (var k in link) if (link[k] === r) return +k; return -1; }
    function draw(){
      var b = box.getBoundingClientRect(); svg.setAttribute('width', b.width); svg.setAttribute('height', b.height);
      var h = '';
      Object.keys(link).forEach(function(k){
        var p1 = pt($('[data-l="' + k + '"]', box), 'l'), p2 = pt($('[data-r="' + link[k] + '"]', box), 'r');
        var c = checked ? (R[link[k]].i === L[k].i ? '#16a34a' : '#dc2626') : COL[k % COL.length];
        h += '<path d="M' + p1.x + ' ' + p1.y + ' C' + (p1.x + 40) + ' ' + p1.y + ' ' + (p2.x - 40) + ' ' + p2.y + ' ' + p2.x + ' ' + p2.y + '" stroke="' + c + '" stroke-width="4" fill="none" stroke-linecap="round"/>';
      });
      if (drag){ h += '<path d="M' + drag.x1 + ' ' + drag.y1 + ' L' + drag.x2 + ' ' + drag.y2 + '" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6 5" fill="none"/>'; }
      svg.innerHTML = h;
      $$('.ln-l', box).forEach(function(e2){ var k = +e2.dataset.l; e2.classList.toggle('sel', selL === k); e2.style.borderColor = link[k] !== undefined ? COL[k % COL.length] : ''; });
      $$('.ln-r', box).forEach(function(e2){ var o = owner(+e2.dataset.r); e2.style.borderColor = o >= 0 ? COL[o % COL.length] : ''; });
      u.foot.innerHTML = (!checked && Object.keys(link).length === L.length) ? '<div class="row"><button class="btn or" data-c>✔ Periksa</button></div>' : (checked ? u.foot.innerHTML : '');
      var c2 = $('[data-c]', u.foot); if (c2) c2.onclick = check;
    }
    function connect(k, r){ var o = owner(r); if (o >= 0) delete link[o]; link[k] = r; selL = null; beep(true); draw(); }
    $$('.ln-l', box).forEach(function(e2){
      e2.addEventListener('pointerdown', function(ev){
        if (checked) return; var k = +e2.dataset.l;
        if (link[k] !== undefined && selL === k){ delete link[k]; selL = null; draw(); return; }
        selL = k; var p = pt(e2, 'l'); drag = {k:k, x1:p.x, y1:p.y, x2:p.x, y2:p.y, moved:false};
        try{ e2.setPointerCapture(ev.pointerId); }catch(e){}
        draw();
      });
      e2.addEventListener('pointermove', function(ev){ if (!drag) return; var b = box.getBoundingClientRect(); drag.x2 = ev.clientX - b.left; drag.y2 = ev.clientY - b.top; drag.moved = true; draw(); });
      e2.addEventListener('pointerup', function(ev){
        if (!drag) return; var d = drag; drag = null;
        var tgt = document.elementFromPoint(ev.clientX, ev.clientY); var rr = tgt && tgt.closest ? tgt.closest('.ln-r') : null;
        if (rr && box.contains(rr)) connect(d.k, +rr.dataset.r); else draw();
      });
    });
    $$('.ln-r', box).forEach(function(e2){ e2.onclick = function(){ if (checked) return; var r = +e2.dataset.r; if (selL !== null) connect(selL, r); else { var o = owner(r); if (o >= 0){ delete link[o]; draw(); } else toast('Pilih kotak di kiri dulu ya 👈'); } }; });
    function check(){
      checked = true; var s = 0, wrong = [];
      L.forEach(function(x, k){ var ok = R[link[k]].i === x.i; if (ok) s++; else wrong.push(x.t + ' → <b>' + a.pairs[x.i][1] + '</b>'); $('[data-l="' + k + '"]', box).classList.add(ok ? 'ok' : 'bad'); });
      u.foot.innerHTML = ''; draw(); beep(s === L.length); award(pk, id, s, L.length);
      resultBox(u.foot, s, L.length, start, wrong.length ? '<div class="hint"><b>Pasangan yang benar:</b><br>' + wrong.join('<br>') + '</div>' : '');
    }
    var ro = function(){ draw(); }; window.addEventListener('resize', ro); el._cleanup = function(){ window.removeEventListener('resize', ro); };
    setTimeout(draw, 30);
  }
  start();
};

E.essay = function(el, a, id, pk){

  var mx = maxOf(a);

    $$('.es textarea', u.body).forEach(function(t){ t.oninput = function(){ var n = t.value.trim() ? t.value.trim().split(/\s+/).length : 0; t.parentNode.querySelector('.es-meta').textContent = n + ' kata' + (n < 10 ? ' · tulis minimal 10 kata' : ' ✓'); }; });

    $('[data-c]', u.foot).onclick = check;
  }
  function check(){
    var s = 0, short = false;
    $$('.es', u.body).forEach(function(c){ if (c.querySelector('textarea').value.trim().split(/\s+/).length < 5) short = true; });
    if (short){ toast('Lengkapi semua jawaban (minimal 5 kata) ✍️'); return; }

      var c = 'cell' + (w ? ' w' : '') + (trail && trail[xx + ',' + yy] ? ' trail' : '') + (hit && hit[0] === xx && hit[1] === yy ? ' hit' : '');
      var inner = (xx === L.g[0] && yy === L.g[1]) ? (L.goal || '⭐') : '';

  function draw(x, y, d, trail, hit, playing){

    var mainN = count(prog);
    var limTxt = music ? (L.maxMain ? 'Blok di Program utama: <b>' + mainN + '</b> / maks ' + L.maxMain : 'Blok: <b>' + used + '</b>') : 'Blok dipakai: <b>' + used + '</b> / maks ' + L.max;
    var h = '<div class="qprog"><span>Level ' + (lv + 1) + ' / ' + a.levels.length + (solved[lv] ? ' ✅' : '') + '</span><span>' + limTxt + '</span></div>' +

    if (music){

    } else {

    }
    h += '<div class="lbl2">🧰 Palet blok (ketuk untuk menambah)</div><div class="bk-pal">' + palette() + '</div>';
    Object.keys(fns).forEach(function(f){ h += lane('🧩 Function ' + f, fns[f], 'f' + f); });
    h += lane('▶ Program utama', prog, 'main');
    h += '<div class="row"><button class="btn gr" data-run' + (running ? ' disabled' : '') + '>▶ Jalankan</button><button class="btn ghost" data-clr' + (running ? ' disabled' : '') + '>⌫ Hapus semua</button>' +
      (a.levels.length > 1 ? '<button class="btn ghost" data-pv' + (lv === 0 || running ? ' disabled' : '') + '>◀ Level</button><button class="btn ghost" data-nv' + (lv >= a.levels.length - 1 || running || !solved[lv] ? ' disabled' : '') + '>Level ▶</button>' : '') + '</div>';
    u.body.innerHTML = h;
    if (running) return;
    $$('[data-add]', u.body).forEach(function(bt){ bt.onclick = function(){ add(bt.dataset.add, bt.dataset.v); }; });
    $$('[data-del]', u.body).forEach(function(bt){ bt.onclick = function(e){ e.stopPropagation(); del(bt.dataset.del); }; });
    $$('[data-sel]', u.body).forEach(function(s){ s.onclick = function(e){ e.stopPropagation(); var b = find(s.dataset.sel); if (b && b.body){ cur = b.body; draw(); } }; });
    $$('[data-lane]', u.body).forEach(function(s){ s.onclick = function(){ var k = s.dataset.lane; cur = k === 'main' ? prog : fns[k.slice(1)]; draw(); }; });
    $$('[data-n]', u.body).forEach(function(s){ s.onclick = function(e){ e.stopPropagation(); var b = find(s.closest('[data-p]').dataset.p); b.n = b.n >= 5 ? 2 : b.n + 1; draw(); }; });
    $('[data-run]', u.body).onclick = run;
    $('[data-clr]', u.body).onclick = function(){ start(); };
    var pv = $('[data-pv]', u.body); if (pv) pv.onclick = function(){ lv--; start(); };
    var nv = $('[data-nv]', u.body); if (nv) nv.onclick = function(){ lv++; start(); };
    var hr = $('[data-hear]', u.body); if (hr) hr.onclick = function(){ play(L.target.map(function(n){ return {n:n}; }), function(){}); };
  }
  function find(path){
    var parts = path.split('.'), list = parts[0] === 'main' ? prog : fns[parts[0].slice(1)], b = null;
    for (var i = 1; i < parts.length; i++){ b = list[+parts[i]]; list = b && b.body; }
    return b;
  }
  function del(path){
    var parts = path.split('.'), list = parts[0] === 'main' ? prog : fns[parts[0].slice(1)];
    for (var i = 1; i < parts.length - 1; i++) list = list[+parts[i]].body;
    var rm = list.splice(+parts[parts.length - 1], 1)[0];
    if (rm && rm.body && (rm.body === cur || contains(rm.body, cur))) cur = list;
    u.foot.innerHTML = ''; draw();
  }
  function contains(list, target){ return list.some(function(b){ return b.body && (b.body === target || contains(b.body, target)); }); }
  function add(t, v){
    if (cur.length >= 20) return toast('Terlalu banyak blok di sini');
    var b = {t:t};
    if (t === 'rep'){ b.n = 2; b.body = []; }
    if (t === 'until') b.body = [];
    if (t === 'note') b.n = v;
    if (t === 'call') b.f = v;
    cur.push(b);
    if (b.body) cur = b.body;
    u.foot.innerHTML = ''; draw();
  }
  function clearRun(list){ list.forEach(function(b){ b.run = false; if (b.body) clearRun(b.body); }); }

  // ---------- menjalankan ----------
  function done(ok, msg, redraw){
    running = false; clearRun(prog); Object.keys(fns).forEach(function(f){ clearRun(fns[f]); });
    if (redraw) redraw(); else draw();
    if (ok){
      solved[lv] = true; S.blk[pk + '|' + id] = solved;
      award(pk, id, solved.filter(Boolean).length, a.levels.length); save();
      beep(true); confetti();
      u.foot.innerHTML = '<div class="res good">' + msg + '</div>' + (lv < a.levels.length - 1 ? '<div class="row"><button class="btn or" data-nx>Level berikutnya →</button></div>' : '<div class="res good">🏆 Semua level selesai!</div>');
      var nx = $('[data-nx]', u.foot); if (nx) nx.onclick = function(){ lv++; start(); };
    } else { beep(false); u.foot.innerHTML = '<div class="res low">' + msg + '</div>'; }
  }
  function run(){
    if (!count(prog)) return toast('Program utama masih kosong');
    running = true; u.foot.innerHTML = '';
    if (music) return runMusic();
    var x = L.s[0], y = L.s[1], d = L.d, trail = {}, steps = 0, crashed = null, win = false;
    trail[x + ',' + y] = 1;
    var seq = [];   // rekam setiap langkah agar animasi berurutan
    function atGoal(){ return x === L.g[0] && y === L.g[1]; }
    function exec(list){
      for (var i = 0; i < list.length; i++){
        if (crashed || win || steps > 200) return;
        var b = list[i];
        if (b.t === 'rep'){ for (var k = 0; k < b.n; k++){ exec(b.body); if (crashed || win) return; } continue; }
        if (b.t === 'until'){ var guard = 0; while (!atGoal() && guard++ < 50){ var before = steps; exec(b.body); if (crashed || win) return; if (steps === before) break; } continue; }
        steps++;
        if (b.t === 'l') d = (d + 3) % 4; else if (b.t === 'r') d = (d + 1) % 4;

          var nx = x + DX[d], ny = y + DY[d];
          if (nx < 0 || ny < 0 || nx >= L.w || ny >= L.h || L.walls.some(function(q){ return q[0] === nx && q[1] === ny; })){ crashed = [Math.max(0, Math.min(L.w - 1, nx)), Math.max(0, Math.min(L.h - 1, ny))]; seq.push({b:b, x:x, y:y, d:d, hit:crashed}); return; }
          x = nx; y = ny;
        }
        seq.push({b:b, x:x, y:y, d:d});
        if (atGoal()) { win = true; return; }
      }
    }
    exec(prog);
    var used = count(prog), k = 0, tr = {}; tr[L.s[0] + ',' + L.s[1]] = 1;
    function tick(){
      if (k > 0) seq[k - 1].b.run = false;
      if (k >= seq.length){
        var s = seq.length ? seq[seq.length - 1] : {x:L.s[0], y:L.s[1], d:L.d};
        var rd = function(){ draw(s.x, s.y, s.d, tr, crashed); };
        if (crashed) return done(false, '💥 Robot menabrak tembok! Periksa urutan blok lalu perbaiki (<b>debugging</b>).', rd);
        if (!win) return done(false, '🤔 Robot belum sampai di tujuan. Tambah atau perbaiki bloknya.', rd);
        if (used > L.max) return done(false, '👏 Robot sampai, tetapi blokmu ' + used + ' (maks ' + L.max + '). Ringkas dengan blok <b>🔁 Ulangi</b>!', rd);
        return done(true, '🎉 Berhasil! Robot sampai di tujuan dengan ' + used + ' blok.', rd);
      }
      var s2 = seq[k]; s2.b.run = true; if (!s2.hit) tr[s2.x + ',' + s2.y] = 1;
      draw(s2.x, s2.y, s2.d, tr, s2.hit); k++; timer = setTimeout(tick, 420);
    }
    draw(L.s[0], L.s[1], L.d, tr); timer = setTimeout(tick, 300);
  }
  var AC2 = null;
  function play(items, cb){
    try { AC2 = AC2 || new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
    var i = 0;
    function nx(){
      if (i > 0 && items[i - 1].ref) items[i - 1].ref.run = false;
      if (i >= items.length){ if (!running) draw(); return cb(); }
      var it = items[i];
      if (it.ref){ it.ref.run = true; draw(); }
      if (AC2){ var o = AC2.createOscillator(), g = AC2.createGain(), t = AC2.currentTime; o.type = 'triangle'; o.frequency.value = NOTE[it.n]; o.connect(g); g.connect(AC2.destination); g.gain.setValueAtTime(.18, t); g.gain.exponentialRampToValueAtTime(.001, t + .38); o.start(t); o.stop(t + .4); }
      i++; timer = setTimeout(nx, 420);
    }
    nx();
  }
  function runMusic(){
    var out = [], usedFn = false, bad = false;
    prog.forEach(function(b){
      if (b.t === 'note') out.push({n:b.n, ref:b});
      else if (b.t === 'call'){ usedFn = true; (fns[b.f] || []).forEach(function(c){ out.push({n:c.n, ref:c, call:b}); }); }
    });
    if (!out.length){ running = false; return toast('Belum ada not yang dibunyikan'); }
    play(out, function(){
      var got = out.map(function(o){ return o.n; }).join(' '), want = L.target.join(' ');
      if (got !== want) return done(false, '🎼 Lagunya belum sama. Kamu membunyikan: <b>' + got + '</b>. Bandingkan dengan lagu target, lalu perbaiki.');
      if (L.needFn && !usedFn) return done(false, '👏 Lagunya benar, tetapi gunakan <b>Function</b> lalu <b>Panggil</b> di Program utama agar lebih singkat!');
      if (L.maxMain && count(prog) > L.maxMain) return done(false, '👏 Lagunya benar, tetapi Program utama ' + count(prog) + ' blok (maks ' + L.maxMain + '). Pindahkan not ke Function!');
      done(true, '🎉 Lagu benar! ' + (usedFn ? 'Function membuat programmu singkat dan rapi.' : ''));
    });
  }
  start();
};

/* ---------- CETAK PDF PEGANGAN SISWA ---------- */
function esc(s){ return String(s); }
function lines(n){ var h = ''; for (var i = 0; i < (n || 2); i++) h += '<div class="ln2"></div>'; return h; }
function staticAct(a){
  if (!a) return '';
  var L = 'abcdefgh', T = {order:'Mengurutkan',match:'Menjodohkan',line:'Tarik Garis',cat:'Mengelompokkan',quiz:'Kuis',team:'Soal Latihan',fill:'Isian Singkat',tablefill:'Lengkapi Tabel',memory:'Pasangkan',maze:'Permainan Algoritma',bug:'Temukan Kesalahan',essay:'Uraian',check:'Daftar Periksa',flip:'Kartu Ringkasan',hot:'Info Penting',kamus:'Kamus Istilah',poll:'Pilih Pendapatmu'};
  var h = '';
  switch (a.type){
    case 'quiz': case 'team':
      h = '<ol>' + a.qs.map(function(q){ var tf = q.o.length === 2 && /^Benar$/.test(q.o[0]); return '<li class="q">' + q.q + (tf ? ' &nbsp; <b>( B / S )</b>' : '<div class="opt">' + q.o.map(function(o, k){ return '<span>' + L.charAt(k) + '. ' + o + '</span>'; }).join('') + '</div>') + '</li>'; }).join('') + '</ol>'; break;
    case 'match': case 'line': case 'memory':
      var R = a.pairs.map(function(x, i){ return {t:x[1], i:i}; }); R = R.slice(1).concat(R.slice(0, 1)).reverse();
      h = tbl(['No','Pernyataan','Jawaban','Pilihan'], a.pairs.map(function(x, i){ return [(i + 1) + '', x[0], '....', L.charAt(i) + '. ' + R[i].t]; })); break;
    case 'cat':
      h = '<p><b>Kelompok:</b> ' + a.cats.map(function(c){ return c.n; }).join(' · ') + '</p>' + tbl(['No','Pernyataan','Kelompok'], a.items.map(function(x, i){ return [(i + 1) + '', x.t, '']; })); break;
    case 'order':
      h = '<p>Beri nomor urut pada kotak:</p>' + tbl(['Urutan','Langkah'], shuffleNot(a.items).map(function(x){ return ['☐', x]; })); break;
    case 'fill':
      h = '<ol>' + a.qs.map(function(q){ return '<li class="q">' + q.q + lines(1) + '</li>'; }).join('') + '</ol>'; break;
    case 'essay':
      h = '<ol>' + a.qs.map(function(q){ return '<li class="q">' + q.q + lines(3) + '</li>'; }).join('') + '</ol>'; break;
    case 'tablefill':
      h = '<p>' + a.text + '</p>' + tbl(a.head, a.rows.map(function(r){ return ['<b>' + r.g + '</b>'].concat(r.c.map(function(){ return ''; })); })); break;
    case 'bug':
      h = '<ol>' + a.items.map(function(it){ return '<li class="q">' + it.g + '<br>' + it.lines.map(function(l){ return '☐ ' + l; }).join('<br>') + '</li>'; }).join('') + '</ol><p class="muted">Centang baris yang salah.</p>'; break;
    case 'check':
      h = a.items.map(function(t){ return '☐ ' + t; }).join('<br>'); break;
    case 'flip':
      h = tbl(['Konsep','Ringkasan'], a.cards.map(function(c){ return [c.e + ' <b>' + c.t + '</b>', c.b]; })); break;
    case 'hot':
      h = tbl(['Bagian','Penjelasan'], a.items.map(function(x){ return ['<b>' + x.l + '</b>', x.d]; })); break;
    case 'kamus':
      h = tbl(['Istilah','Arti'], a.items.map(function(r){ return ['<b>' + r[0] + '</b>', r[1]]; })); break;
    case 'poll':
      h = a.opts.map(function(o){ return '☐ ' + o.e + ' ' + o.t; }).join(' &nbsp; '); break;
    case 'maze':
      h = '<p>Permainan robot dikerjakan pada versi interaktif (laptop/HP/IFP).</p>'; break;
    default: return '';
  }
  return '<div class="pact"><div class="pact-h">🎮 ' + (T[a.type] || 'Aktivitas') + (a.title ? ': ' + a.title : '') + '</div>' + (a.ins ? '<div class="ins">👉 ' + a.ins + '</div>' : '') + h + '</div>';
}
function printP(bi, pi, noDialog){
  var b = BOOKS[bi], p = b.P[pi];
  setTheme(b);
  var sec = STEPS.filter(function(s){ return s.k !== 'judul' && s.k !== 'penutup'; }).map(function(s){
    var html = (p.c[s.k] || '').replace(/<div data-act="([^"]+)"><\/div>/g, function(m, id){ return staticAct(p.acts[id]); });

    '<div class="pr-foot">Pegangan Siswa · ' + b.label + ' ' + b.title + ' · ' + unit(b) + ' ' + p.no + ' · Informatika VIII SMP Negeri 6 Mengwi</div>';

}

/* ---------- KEYBOARD & GESER ---------- */
document.addEventListener('keydown', function(e){
  var t = e.target.tagName; if (t === 'INPUT' || t === 'TEXTAREA') return;
  if (e.key === 'Escape' && document.body.classList.contains('mini')) document.body.classList.remove('mini');
  if (cur === null) return;

  else if (e.key === 'ArrowLeft') $('#prev').click();
});
var tx = 0, ty = 0, tOk = false;
document.addEventListener('touchstart', function(e){ var t = e.target; tOk = cur !== null && !(t.closest && (t.closest('.act') || t.closest('input') || t.closest('textarea') || t.closest('.stepper') || t.closest('.tblwrap') || t.closest('[data-act]'))); tx = e.changedTouches[0].clientX; ty = e.changedTouches[0].clientY; }, {passive:true});
document.addEventListener('touchend', function(e){ if (!tOk) return; var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; if (Math.abs(dx) > 90 && Math.abs(dx) > Math.abs(dy) * 2){ if (dx < 0) nextStep(); else $('#prev').click(); } }, {passive:true});

/* ---------- SIMPAN OTOMATIS JAWABAN (cache di perangkat) ---------- */
S.draft = S.draft || {};
function draftFields(box){ return $$('input[type="text"], input:not([type]), textarea', box).filter(function(x){ return !x.closest('.namebox'); }); }
function draftKey(p, box, el){ return p.key + '|' + box.dataset.act + '|' + draftFields(box).indexOf(el); }
function restoreDrafts(content, p){
  $$('[data-act]', content).forEach(function(box){
    draftFields(box).forEach(function(el){
      var v = S.draft[draftKey(p, box, el)];
      if (v && !el.value && !el.disabled){ el.value = v; el.dispatchEvent(new Event('input')); }
    });
  });
}
var draftT = null;
document.addEventListener('input', function(e){
  var el = e.target, box = el.closest && el.closest('[data-act]');
  if (!box || cur === null || el.disabled || !e.isTrusted) return;
  if (draftFields(box).indexOf(el) < 0) return;
  S.draft[draftKey(PP(), box, el)] = el.value;
  clearTimeout(draftT); draftT = setTimeout(function(){ save(); var s = $('.lk-saved', box); if (s) s.textContent = '✓ Tersimpan otomatis ' + new Date().toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'}); }, 400);
});
window.addEventListener('pagehide', function(){ save(); });
document.addEventListener('visibilitychange', function(){ if (document.hidden) save(); });

/* ---------- LKPD INTERAKTIF ---------- */
E.lkpd = function(el, a, id, pk){
  var u = shell(el, a, 'LKPD · isi langsung di sini', '📝');
  var d = a.d, no = 0;
  u.body.innerHTML = '<div class="act-ins">👉 Ketik jawabanmu di kotak. Jawaban <b>tersimpan otomatis</b> di perangkat ini, walaupun aplikasi tertutup atau kamu pindah halaman. Setelah selesai, tekan <b>Salin Jawaban</b> lalu tempel (paste) di WhatsApp kepada guru.</div>' +
    d.sec.map(function(s){
      return '<div class="card"><h4>' + s.h + '</h4>' + (s.intro ? '<p class="muted">' + s.intro + '</p>' : '') +
        s.items.map(function(q, i){ no++; return '<div class="lk-q"><label><b>' + (i + 1) + '.</b> ' + q + '</label><textarea rows="2" data-q="' + no + '" placeholder="Ketik jawabanmu…"></textarea></div>'; }).join('') +
        (s.hint ? '<div class="hint">💡 <b>Petunjuk:</b> ' + s.hint + '</div>' : '') + '</div>';
    }).join('') + '<div class="lk-saved muted"></div>';
  u.foot.innerHTML = '<div class="row"><button class="btn or" data-cp>📋 Salin Jawaban</button><button class="btn ghost" data-dl>📄 Unduh LKPD (PDF)</button><button class="btn ghost" data-clr>🗑️ Kosongkan</button></div>';
  $('[data-cp]', u.foot).onclick = function(){
    var lines = ['LKPD ' + B().label + ' Pertemuan ' + d.no + ' · ' + d.title.replace(/<[^>]+>/g, ''), 'Nama: ' + (S.name || '........'), ''];
    var k = 0;
    d.sec.forEach(function(s){ lines.push(s.h.replace(/<[^>]+>/g, '')); s.items.forEach(function(q, i){ var v = $$('textarea', u.body)[k++].value.trim(); lines.push((i + 1) + '. ' + (v || '-')); }); lines.push(''); });
    var txt = lines.join('\n');
    function ok(){ toast('✅ Jawaban disalin. Tempel di WhatsApp ya!'); beep(true); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, fb); else fb();
    function fb(){ var ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); ok(); } catch(e){ toast('Salin manual: tekan lama lalu Salin'); } ta.remove(); }
  };
  $('[data-dl]', u.foot).onclick = function(){ downloadLkpd(curB, cur); };
  $('[data-clr]', u.foot).onclick = function(){ if (!confirm('Kosongkan semua jawaban LKPD ini?')) return; $$('textarea', u.body).forEach(function(t, i){ t.value = ''; delete S.draft[pk + '|' + id + '|' + i]; }); save(); toast('Jawaban dikosongkan'); };
};
/* ---------- KIRIM NILAI KE GOOGLE SHEETS ---------- */
S.outbox = S.outbox || [];
if (!S.dev){ S.dev = Math.random().toString(36).slice(2, 10); }
function pScoreFirst(p){ var s = 0, m = 0, r = (S.first || {})[p.key] || {}, any = false; Object.keys(p.acts).forEach(function(id){ var mx = maxOf(p.acts[id]); if (mx > 0){ m += mx; if (r[id]){ s += r[id].s; any = true; } } }); return any && m ? Math.round(s / m * 100) : ''; }
function lkpdData(p){
  var ids = Object.keys(p.acts).filter(function(id){ return /^lk/.test(id) && maxOf(p.acts[id]) > 0; });
  if (!ids.length) return {n:'', t:''};
  var r = S.res[p.key] || {}, s = 0, m = 0, any = false, parts = [];
  ids.forEach(function(id){
    var a = p.acts[id], mx = maxOf(a); m += mx; if (r[id]){ s += r[id].s; any = true; }
    var nm = String(a.title || id).split(' · ')[0].replace(/<[^>]+>/g, '').replace('LKPD ', '');
    if (a.type === 'fill' || a.type === 'tablefill'){
      var n = a.type === 'fill' ? a.qs.length : a.rows.reduce(function(x, rr){ return x + rr.c.length; }, 0), arr = [];
      for (var i = 0; i < n; i++) arr.push(S.draft[p.key + '|' + id + '|' + i] || '-');
      parts.push(nm + ': ' + arr.join(', '));
    } else parts.push(nm + ': ' + (r[id] ? 'benar ' + r[id].s + '/' + r[id].m : 'belum'));
  });
  return {n: any ? Math.round(s / m * 100) : '', t: parts.join(' | ')};
}function sendInfo(p){
  var el = $('#sendInfo'); if (!el) return;
  var sc = pScore(p), lk = lkpdData(p);
  el.innerHTML = tbl(['Data yang dikirim',''], [['Identitas', profOk() ? '<b>' + profLabel() + '</b>' : '<span style="color:#dc2626">belum lengkap</span>'], ['Nilai pertemuan', sc.pct + ' / 100'], ['Nilai percobaan pertama', (pScoreFirst(p) === '' ? '-' : pScoreFirst(p) + ' / 100')], ['Nilai LKPD', lk.n === '' ? 'belum dikerjakan' : lk.n + ' / 100']]);
}
function profModal(done){
  var m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = '<div class="modal-box" style="max-width:560px"><div class="modal-h"><h3>👤 Identitas Siswa</h3><button class="ib" data-x>✕</button></div>' + nameBox() + '</div>';
  document.body.appendChild(m);
  $('.namebox small', m).textContent = 'Isi dengan benar agar nilaimu masuk ke daftar guru.';
  $('#nmSave', m).onclick = function(){ if (readProf()){ m.remove(); toast('Identitas tersimpan ✅'); if (done) done(); } else toast('Lengkapi nama lengkap, kelas, dan nomor absen'); };
  $('[data-x]', m).onclick = function(){ m.remove(); };
}
function postNilai(d){
  return fetch(SEND_URL, {method:'POST', body: JSON.stringify(d)}).then(function(r){ return r.json(); }).then(function(j){ if (!j.ok) throw new Error(j.pesan || 'gagal'); return j; });
}
function kirimNilai(p){
  if (!SEND_URL){ toast('Alamat penerima nilai belum dipasang guru'); return; }
  if (!profOk()){ profModal(function(){ sendInfo(p); kirimNilai(p); }); return; }
  var b = B(), sc = pScore(p), lk = lkpdData(p), st = $('#sendSt');
  var d = {sheet: String(b.send).replace(/\{kelas\}/g, S.prof.kelas).replace(/\{sem\}/g, String(semOf(b))), nama: S.prof.nama, kelas: S.prof.kelas, absen: S.prof.absen, bab: b.label, pertemuan: p.no, judul: p.title.replace(/<[^>]+>/g, ''), nilai: sc.pct, nilaiPertama: pScoreFirst(p), nilaiLkpd: lk.n, jawabanLkpd: lk.t, perangkat: S.dev, semester: semOf(b)};
  if (st) st.textContent = '⏳ Mengirim…';
  postNilai(d).then(function(j){ if (st) st.innerHTML = '✅ Terkirim ' + new Date().toLocaleString('id-ID') + ' (kiriman ke-' + j.jumlah + ')'; beep(true); toast('✅ Nilai terkirim ke guru'); }).catch(function(){
    S.outbox = S.outbox.filter(function(x){ return !(x.sheet === d.sheet && x.pertemuan === d.pertemuan); }); S.outbox.push(d); save();
    if (st) st.innerHTML = '⚠️ Belum terkirim (internet bermasalah). Nilai disimpan dan akan dikirim otomatis saat online.';
    toast('⚠️ Belum terkirim, akan dicoba lagi otomatis');
  });
}
function kirimAntrean(){
  if (!SEND_URL || !S.outbox.length || !navigator.onLine) return;
  var d = S.outbox[0];
  postNilai(d).then(function(){ S.outbox.shift(); save(); toast('✅ Nilai tertunda berhasil dikirim'); kirimAntrean(); }).catch(function(){});
}
window.addEventListener('online', kirimAntrean);
setTimeout(kirimAntrean, 3000);
route();
